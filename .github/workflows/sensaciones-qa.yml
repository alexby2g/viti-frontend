name: Sensaciones frontend QA
on:
  push:
    branches: [sensaciones-v4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/build-sensaciones-preview.mjs
      - run: test -f dist/spa/index.html
      - run: npm run test:viti-stability
      - run: npm run test:viti-public
