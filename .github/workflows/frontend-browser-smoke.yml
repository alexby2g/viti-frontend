name: Frontend Browser Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  browser-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Chrome browser smoke
        run: bash scripts/browser-smoke.sh

      - name: Chrome public flow smoke
        run: bash scripts/browser-flow-smoke.sh

      - name: Chrome authenticated tenant smoke
        run: bash scripts/browser-auth-smoke.sh

      # Keep this workflow explicitly tied to the current public-flow smoke contract.
