name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: AGR assistant POST transport smoke
        run: npm run test:viti-assistant-transport

      - name: AGR Ollama opt-in smoke
        run: npm run test:viti-ollama-optin

      - name: IRENET local mode smoke
        run: npm run test:viti-irenet-local

      - name: AGR readable chat and request analysis smoke
        run: npm run test:viti-chat-ux

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint -- --max-warnings=50

      - name: VITI stability smoke
        run: npm run test:viti-stability

      - name: VITI project task board smoke
        run: npm run test:viti-work-tasks

      - name: VITI unified simple commercial flow smoke
        run: npm run test:viti-unified

      - name: VITI formal delivery and customer portal smoke
        run: npm run test:viti-delivery

      - name: VITI public presentation smoke
        run: npm run test:viti-public

      - name: Production build
        run: npm run build
