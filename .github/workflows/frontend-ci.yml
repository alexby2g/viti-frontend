name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Diagnóstico temporal: obtener un lockfile corregido sin escribir al repositorio.
      - name: Prepare reviewed dependency lock candidate
        run: |
          npm audit fix --package-lock-only --omit=dev
          node - <<'NODE'
          const fs = require('node:fs')
          for (const name of ['package.json', 'package-lock.json']) {
            const value = JSON.stringify(JSON.parse(fs.readFileSync(name, 'utf8')))
            console.log('VITI_DEPENDENCY_OUTPUT_BEGIN ' + name + ' ' + value.length)
            for (let offset = 0; offset < value.length; offset += 2000) {
              console.log('VITI_DEPENDENCY_OUTPUT_CHUNK ' + name + ' ' + (offset / 2000) + ' ' + value.slice(offset, offset + 2000))
            }
            console.log('VITI_DEPENDENCY_OUTPUT_END ' + name)
          }
          NODE

      - name: AGR assistant POST transport smoke
        run: npm run test:viti-assistant-transport

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint -- --max-warnings=50

      - name: VITI stability smoke
        run: npm run test:viti-stability

      - name: VITI public presentation smoke
        run: npm run test:viti-public

      - name: Production build
        run: npm run build
