name: Frontend CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate narrow npm security patch
        run: |
          npm audit fix --package-lock-only || true
          git diff -- package-lock.json
          test -z "$(git diff --name-only -- package.json)"

      - name: Persist generated lock patch on PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to persist."
          else
            git commit -m "Actualizar nanoid a versión corregida"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint -- --max-warnings=50

      - name: Production build
        run: npm run build
