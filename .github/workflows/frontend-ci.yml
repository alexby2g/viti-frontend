name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint -- --max-warnings=50

      - name: VITI stability smoke
        run: npm run test:viti-stability

      - name: VITI public presentation smoke
        run: npm run test:viti-public

      - name: VITI access control smoke
        run: npm run test:viti-access

      - name: VITI phase 1 UX smoke
        run: npm run test:viti-phase1

      - name: Production build
        run: npm run build
